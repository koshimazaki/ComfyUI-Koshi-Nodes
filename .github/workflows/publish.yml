# Publishes the pack to the ComfyUI Registry (registry.comfy.org).
#
# Runs on every push to main that changes pyproject.toml — so bumping
# `version` there is the release action — and can be triggered by hand from
# the Actions tab. It needs a repository secret REGISTRY_ACCESS_TOKEN holding
# an API key for the publisher named in [tool.comfy]; until that secret exists
# the job fails at the publish step and nothing is uploaded.
#
# Template: https://docs.comfy.org/registry/publishing

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # Forks carry this file too; only the upstream repo may publish as "koshi".
    if: ${{ github.repository_owner == 'koshimazaki' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
