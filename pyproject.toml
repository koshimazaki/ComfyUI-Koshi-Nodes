[project]
name = "comfyui-koshi-nodes"
version = "0.3.0"
description = "Focused ComfyUI nodes: Flux Motion (Deforum-style latent animation, audio-driven schedules), Effects, Generators, AKUSPACE spatial-audio conditioning, SIDKIT OLED export, metadata"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.0",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
flux = [
    "transformers>=4.36.0",
    "diffusers>=0.25.0",
    "accelerate",
    "sentencepiece",
]
audio = [
    "librosa",
    "soundfile",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
all = [
    "comfyui-koshi-nodes[flux,audio]",
]

[project.urls]
Repository = "https://github.com/koshimazaki/ComfyUI-Koshi-Nodes"
Documentation = "https://github.com/koshimazaki/ComfyUI-Koshi-Nodes#readme"

# Read by the ComfyUI Registry (registry.comfy.org). The table must be
# [tool.comfy]; the registry ignores [tool.comfyui].
[tool.comfy]
PublisherId = "koshi"
DisplayName = "Koshi Nodes"
Icon = "https://avatars.githubusercontent.com/u/18751916"
